name: mec-inep-pipeline

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Monta o repositório inteiro dentro do container de desenvolvimento
      - ..:/workspace:cached
    command: sleep infinity
    env_file:
      # Carregado apenas se o .env já existir (Codespaces cria o repo antes do 1º build,
      # então copie .env.example -> .env logo após o postCreateCommand rodar).
      - path: ../.env
        required: false
    environment:
      # Dentro do compose, o Postgres é acessado pelo nome do serviço, não por localhost.
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mec_inep}
      POSTGRES_USER: ${POSTGRES_USER:-mec_inep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mec_inep_user} -d ${POSTGRES_DB:-mec_inep}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
