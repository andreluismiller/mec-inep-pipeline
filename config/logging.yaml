# ==============================================================================
# Configuração de logging (logging.config.dictConfig)
# ------------------------------------------------------------------------------
# Carregada por src/mec_inep_pipeline/utils/logging.py::setup_logging().
# O nível raiz pode ser sobrescrito pela variável de ambiente LOG_LEVEL (.env).
# ==============================================================================

version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    format: '{"ts": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "message": "%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: logs/pipeline.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    encoding: utf-8

root:
  level: INFO
  handlers: [console, file]

loggers:
  mec_inep_pipeline:
    level: INFO
    handlers: [console, file]
    propagate: false
  dlt:
    level: WARNING
    handlers: [console, file]
    propagate: false
  sqlmesh:
    level: INFO
    handlers: [console, file]
    propagate: false
  # Bibliotecas de terceiros barulhentas
  urllib3:
    level: WARNING
    propagate: true
